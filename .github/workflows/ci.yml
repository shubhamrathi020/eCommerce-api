# NOTE: this pipeline installs dependencies from the registry/git only. While package.json still says
# "@ecom/contracts": "link:../eCommerce-contracts" (a sibling folder on your machine), CI cannot install it.
# Publish the eCommerce-contracts repository, then run `pnpm add github:<account>/eCommerce-contracts#v0.1.0`
# (see README.md, "Working with the contracts package") and delete the `contracts` stage from apps/api/Dockerfile.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The API tests run against real data stores (see apps/api/test/global-setup.ts for the defaults used here).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports: ["5672:5672"]
      meilisearch:
        image: getmeili/meilisearch:v1.54
        ports: ["7700:7700"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db:generate

      - name: Lint, test and build
        run: pnpm exec nx run-many -t lint test build

      - name: Dependency audit (high severity and above)
        run: pnpm audit --audit-level high --prod
        continue-on-error: true # reported, not blocking, until a triage process exists

  images:
    name: Container image and manifests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          load: true # kept locally so the scan step below can read it
          tags: shop-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Image scanning (BRD 25, K8-04). Fails the job on a fixable CRITICAL finding; HIGH is reported but not
      # blocking yet, same "reported before enforced" posture as the dependency audit above.
      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: shop-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Validate Kubernetes manifests render
        run: |
          # kustomize's secretGenerator reads real (gitignored) env files; CI has only the committed
          # .example templates, whose dev-only values are fine for a render check.
          for f in deploy/k8s/base/secrets/*.env.example deploy/k8s/data-tier/secrets/*.env.example; do cp "$f" "${f%.example}"; done
          curl -sSL -o kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          chmod +x kubectl
          ./kubectl kustomize deploy/k8s/base > /dev/null
          ./kubectl kustomize deploy/k8s/data-tier > /dev/null
