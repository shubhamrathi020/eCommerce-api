# Single-replica Postgres (BRD 25, K8-01) — a real managed database (RDS/Cloud SQL) replaces this in a
# real cloud environment (K8-05); this is what "run the full stack locally" needs. In the `shop-data`
# namespace (see namespace.yaml's own comment for why), not `shop` — everything else lives in `shop`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate # a second pod cannot share this PVC; recreate rather than roll
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 512Mi }
          # No `capabilities: drop: ["ALL"]` here on purpose, unlike every other workload in this
          # project: dropping all capabilities strips CAP_CHOWN/CAP_FOWNER even from root, and the
          # entrypoint's one-time `chown`/`chmod` of a fresh PVC needs exactly those — found by adding the
          # drop back defensively, watching the pod crash-loop on the very same "Operation not permitted"
          # even after moving to a `baseline`-PSS namespace, and realising the container-level
          # capabilities drop (not the namespace's Pod Security level) was the actual remaining cause.
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ecommerce"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ecommerce"]
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # avoid postgres complaining about a non-empty mount root (lost+found etc.)
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
