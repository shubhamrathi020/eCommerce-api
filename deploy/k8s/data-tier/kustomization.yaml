apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-data
resources:
  - namespace.yaml
  - postgres.yaml
  - network-policy.yaml
secretGenerator:
  - name: postgres-secret
    envs:
      - secrets/postgres.env # duplicated from ../base/secrets — kustomize forbids reading outside its own tree
