# Run the backend and its data stores locally:  docker compose up --build
#   API: http://localhost:3333 (the storefront and admin are in the separate eCommerce repository and
#   point at it with API_ORIGIN / realCommerce; see that repository's docker-compose.yml)
#   Meilisearch: http://localhost:7700     Mongo: localhost:27017     RabbitMQ: http://localhost:15672
#   Prometheus: http://localhost:9090      Grafana: http://localhost:3001     Alertmanager: http://localhost:9093
name: shop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Catalog store (BRD 20, CS-01): flexible product/category attributes, as decided in BRD 19's F4.
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Message broker (BRD 23, MQ-01): the outbox relay publishes here; notification/scheduler consumers
  # read from here. Management UI (guest/guest by default) at http://localhost:15672.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Search engine (BRD 20, CS-03): typo-tolerant, faceted product search.
  meilisearch:
    image: getmeili/meilisearch:v1.54
    ports:
      - "7700:7700"
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: "development"
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot: loads the 252 seeded products (+ categories, brands, collections, reviews) into Mongo and
  # builds the Meilisearch index, then exits. The API waits for it. Safe to re-run (every write is an
  # upsert/replace), so it also runs on every `docker compose up`, not only the first time.
  catalog-seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      additional_contexts:
        contracts_src: ../eCommerce-contracts
      target: migrate
    image: shop-api-migrate:local
    entrypoint: ["node", "--import", "tsx", "apps/api/scripts/seed-catalog.ts"]
    environment:
      MONGODB_URL: "mongodb://mongo:27017"
      MEILI_URL: "http://meilisearch:7700"
    depends_on:
      mongo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: "no"

  # One-shot: applies database migrations and seeds the demo accounts, then exits. The API waits for it.
  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      additional_contexts:
        contracts_src: ../eCommerce-contracts
      target: migrate
    image: shop-api-migrate:local
    environment:
      DATABASE_URL: "postgresql://ecommerce:ecommerce@postgres:5432/ecommerce?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      additional_contexts:
        contracts_src: ../eCommerce-contracts
      target: runtime
    image: shop-api:local
    ports:
      - "3333:3333"
    environment:
      PORT: "3333"
      NODE_ENV: production
      DATABASE_URL: "postgresql://ecommerce:ecommerce@postgres:5432/ecommerce?schema=public"
      REDIS_URL: "redis://redis:6379"
      MONGODB_URL: "mongodb://mongo:27017"
      MEILI_URL: "http://meilisearch:7700"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      # Dev-only defaults so the stack runs out of the box; override for anything beyond local use.
      JWT_ACCESS_SECRET: "dev-only-access-secret-change-me-please-32chars"
      JWT_REFRESH_SECRET: "dev-only-refresh-secret-change-me-please-32chr"
      CORS_ORIGINS: "http://localhost:4000,http://localhost:4001,http://localhost:4200,http://localhost:4201,http://localhost:4202"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      catalog-seed:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Observability (BRD 24, OB-01/OB-04): Prometheus scrapes the API's /metrics every 15s; Grafana (default
  # login admin/admin, change it if this is ever reachable beyond your own machine) is pre-provisioned
  # with that Prometheus as its datasource and a real "eCommerce API overview" dashboard — nothing to
  # click through to see it. `docker compose up -d prometheus grafana` on their own is enough if you don't
  # need the rest of the stack running too.
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux needs this explicitly; Docker Desktop (Win/Mac) already resolves it
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  # A real HTTP receiver for Alertmanager's webhook — logs every alert it gets (`docker compose logs
  # alert-log`) since no real Slack/email account exists in this environment (see alertmanager.yml).
  alert-log:
    image: node:22-alpine
    volumes:
      - ./deploy/observability/alert-log.mjs:/app/alert-log.mjs:ro
    command: ["node", "/app/alert-log.mjs"]
    restart: unless-stopped

  # Centralised, searchable logs (BRD 24, OB-02) — every container's own stdout, shipped by Promtail,
  # queryable in Grafana's Explore by request id (search for the id header/log line your browser saw,
  # e.g. the `x-request-id` response header or the `requestId` field `ApiErrorFilter` already logs) to
  # follow one request across the API's own log lines.
  loki:
    image: grafana/loki:3.3.0
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.0
    volumes:
      - ./deploy/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local dev only — anonymous viewer access, no login needed
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  meili-data:
  grafana-data:
